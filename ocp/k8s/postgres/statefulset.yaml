apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ${NAMESPACE}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: ndvm
      # NOTE: pgvector/pgvector:pg16 is the upstream postgres image; it
      # hard-requires UID 999 (or root) to initialize PGDATA and cannot run
      # under OpenShift's default arbitrary-UID "restricted" SCC. Grant the
      # ndvm service account "anyuid" first:
      #   oc adm policy add-scc-to-user anyuid -z ndvm -n ${NAMESPACE}
      # (see ocp/k8s/serviceaccount-scc-anyuid.md). No runAsUser/fsGroup is
      # pinned here — anyuid lets the image's own USER directive take effect.
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: ndvm-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: ${POSTGRES_CPU_REQUEST}
              memory: ${POSTGRES_MEMORY_REQUEST}
            limits:
              cpu: ${POSTGRES_CPU_LIMIT}
              memory: ${POSTGRES_MEMORY_LIMIT}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init-db
          configMap:
            name: ndvm-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Trial/sandbox projects usually carry a small total storage
            # quota; default kept modest (override via POSTGRES_STORAGE).
            storage: ${POSTGRES_STORAGE}
