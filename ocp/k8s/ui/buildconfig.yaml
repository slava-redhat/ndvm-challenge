apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ui
  namespace: ${NAMESPACE}
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: ui:${TAG}
  # Binary build: source is pushed at build time via
  # `oc start-build ui --from-dir=ui --follow` (see ocp/openshift.py).
