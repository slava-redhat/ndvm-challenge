apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ${NAMESPACE}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: ndvm
      # pgvector/pgvector:pg16 (built on the official postgres image) already
      # supports OpenShift's arbitrary-UID model out of the box: nss_wrapper
      # fakes a /etc/passwd entry, and the data dirs are world-writable in the
      # image. The mounted PVC gets proper group-write permissions from
      # OpenShift's auto-injected fsGroup (restricted SCC), so no "anyuid"
      # grant is required. No runAsUser/fsGroup pinned here on purpose.
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: ndvm-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: ${POSTGRES_CPU_REQUEST}
              memory: ${POSTGRES_MEMORY_REQUEST}
            limits:
              cpu: ${POSTGRES_CPU_LIMIT}
              memory: ${POSTGRES_MEMORY_LIMIT}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init-db
          configMap:
            name: ndvm-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Trial/sandbox projects usually carry a small total storage
            # quota; default kept modest (override via POSTGRES_STORAGE).
            storage: ${POSTGRES_STORAGE}
