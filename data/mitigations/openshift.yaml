# OpenShift non-disruptive mitigation menu. Stable `id` per row; LLM never invents options.
# source_url MUST be access.redhat.com and HTTP 200.
# Each row MUST set either non-empty `components` (component gate) or `scope: generic`
# (platform compensating control). Empty components without scope are rejected at apply time.
platform: openshift
mitigations:
  - id: ocp_networkpolicy
    title: Isolate workloads with a NetworkPolicy
    action_type: network
    description: >
      Apply a NetworkPolicy to cut off ingress/egress to the vulnerable pod so the
      attack surface is removed without redeploying the workload.
    disruption: low
    effectiveness: 3
    effort: 2
    applies_when: network-reachable CVE in a namespaced workload, NetworkPolicy
    scope: generic
    source_url: https://access.redhat.com/solutions/3660771
  - id: ocp_egress_policy
    title: Restrict egress with an EgressNetworkPolicy or AdminNetworkPolicy
    action_type: network
    description: >
      Limit outbound paths from the affected namespace so a compromised pod cannot
      exfiltrate or pivot, without changing the application image.
    disruption: low
    effectiveness: 3
    effort: 2
    applies_when: egress, AdminNetworkPolicy, EgressNetworkPolicy, network-facing
    scope: generic
    source_url: https://access.redhat.com/solutions/7092810
  - id: ocp_scc
    title: Tighten the Security Context Constraint (SCC)
    action_type: config
    description: >
      Drop capabilities / enforce a more restricted SCC on the affected workload
      to block the privilege the exploit needs.
    disruption: low
    effectiveness: 3
    effort: 2
    applies_when: exploit needs elevated container privileges, SCC
    scope: generic
    steps:
      - Prefer restricted (or restricted-v2) SCC over privileged / anyuid
      - Review ServiceAccount SCC bindings for the affected workload
      - Confirm pods no longer request disallowed capabilities
    source_url: https://access.redhat.com/solutions/5243301
  - id: ocp_restricted_v2
    title: Enforce restricted-v2 Pod Security standards
    action_type: config
    description: >
      Label namespaces for restricted (or restricted-v2) Pod Security so new and
      updated pods cannot request privileged capabilities the CVE requires.
    disruption: low
    effectiveness: 3
    effort: 2
    applies_when: Pod Security, restricted-v2, privileged container
    scope: generic
    source_url: https://access.redhat.com/solutions/6975936
  - id: ocp_admission_block
    title: Block the image/version with an admission policy
    action_type: config
    description: >
      Use an admission controller / policy engine to prevent scheduling of the
      vulnerable image tag until a fixed image is available.
    disruption: medium
    effectiveness: 4
    effort: 3
    applies_when: vulnerable container image identified, admission
    scope: generic
    source_url: https://access.redhat.com/products/advanced-cluster-security-for-kubernetes/
  - id: ocp_image_policy
    title: Enforce ClusterImagePolicy / signed images only
    action_type: config
    description: >
      Require signed, trusted images so unfixed or unexpected tags cannot be
      pulled into the cluster while the CVE is under freeze.
    disruption: medium
    effectiveness: 3
    effort: 3
    applies_when: image signature, ClusterImagePolicy, supply chain
    scope: generic
    source_url: https://access.redhat.com/products/advanced-cluster-security-for-kubernetes/
  - id: ocp_cut_route
    title: Cut Route or Service exposure
    action_type: network
    description: >
      Remove or narrow the Route/Service that publishes the vulnerable component
      so it is no longer internet-facing until a fixed build is rolled out.
    disruption: medium
    effectiveness: 4
    effort: 1
    applies_when: Route, Service, ingress, network-facing
    scope: generic
    source_url: https://access.redhat.com/solutions/4783921
  - id: ocp_scale_zero
    title: Scale down the non-essential vulnerable component
    action_type: disable
    description: >
      Temporarily scale the vulnerable, non-critical Deployment to zero to remove
      the exposure while a fix is scheduled.
    disruption: medium
    effectiveness: 4
    effort: 1
    applies_when: component non-essential and can be paused, Deployment
    scope: generic
    source_url: https://access.redhat.com/products/openshift/
  - id: ocp_pause_operator
    title: Pause or scale a non-critical Operator
    action_type: disable
    description: >
      If the CVE is in an optional Operator that can be suspended, scale its
      operands down or remove the subscription temporarily to cut exposure
      without touching core platform Operators.
    disruption: medium
    effectiveness: 4
    effort: 2
    applies_when: optional Operator, OLM, non-essential
    scope: generic
    source_url: https://access.redhat.com/products/openshift/
  - id: ocp_acs_policy
    title: Block risky deployments with ACS policies
    action_type: compensating
    description: >
      Use Red Hat Advanced Cluster Security policies to fail builds/deploys that
      match the vulnerable image or privilege profile until a fixed image is
      approved.
    disruption: low
    effectiveness: 3
    effort: 2
    applies_when: ACS, RHACS, image policy, admission
    scope: generic
    source_url: https://access.redhat.com/products/advanced-cluster-security-for-kubernetes/
  - id: ocp_default_deny
    title: Isolate the project with a tighter NetworkPolicy default-deny
    action_type: network
    description: >
      Apply default-deny ingress (and optionally egress) in the project, then
      allow only known peers, so lateral movement to the vulnerable pod is blocked.
    disruption: medium
    effectiveness: 3
    effort: 2
    applies_when: default-deny, NetworkPolicy, multi-tenant
    scope: generic
    source_url: https://access.redhat.com/solutions/5569821
  - id: ocp_quarantine_nodes
    title: Quarantine nodes hosting the vulnerable workload
    action_type: network
    description: >
      Cordon and drain non-critical nodes—or isolate them with SDN / firewall
      controls—so the vulnerable pods are not reachable from untrusted networks
      until patched images are rolled.
    disruption: medium
    effectiveness: 3
    effort: 3
    applies_when: node quarantine, cordon, estate segmentation
    scope: generic
    source_url: https://access.redhat.com/products/openshift/
  - id: ocp_roll_image
    title: Roll a fixed image via DeploymentConfig / Deployment without cluster reboot
    action_type: config
    description: >
      When a fixed container image exists, roll the Deployment to the new tag
      with maxUnavailable controls so exposure drops without rebooting nodes.
    disruption: low
    effectiveness: 4
    effort: 2
    applies_when: fixed image available, rolling update, Deployment
    fix_states: [Fixed]
    scope: generic
    source_url: https://access.redhat.com/products/openshift/
  - id: ocp_vex_not_affected
    title: Confirm "not affected" via Red Hat VEX
    action_type: verify
    description: >
      If Red Hat's signed VEX marks the OpenShift component known_not_affected, take
      no change and record the VEX as evidence.
    disruption: none
    effectiveness: 4
    effort: 1
    applies_when: VEX status known_not_affected
    fix_states: ["Not affected"]
    scope: generic
    source_url: https://access.redhat.com/security/data/csaf/v2/vex/
