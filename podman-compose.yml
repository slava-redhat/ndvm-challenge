# NDVM stack. 4 services: db(pgvector) + ingest(one-shot) + orchestrator + ui.
# Embeddings use your HOST Ollama (GPU via Vulkan on the AMD 780M) at
# host.containers.internal:11434 — no ollama container needed.
# Run:  podman compose --env-file .env up --build
version: "3"

services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build: ./ingest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.containers.internal:host-gateway"   # reach host Ollama (GPU)
    volumes:
      - ./data:/app/data:ro,Z
    restart: "no"        # one-shot job

  orchestrator:
    build: ./orchestrator
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.containers.internal:host-gateway"   # reach host Ollama (GPU)
    # Rootless podman maps your host UID -> container root; keep-id maps it to the
    # non-root 'app' user (uid 1000) so it can read the 0600 ADC credential below.
    userns_mode: "keep-id:uid=1000,gid=1000"
    ports:
      - "8000:8000"
    volumes:
      # Corporate Claude via Vertex: ADC lives in the repo dir (gitignored),
      # mounted read-only as the single credential file the app reads.
      - ./.application_default_credentials.json:/gcloud/application_default_credentials.json:ro,Z

  ui:
    build: ./ui
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator
    ports:
      - "8501:8501"

volumes:
  pgdata:
